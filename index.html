<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Management System</title>
    <link rel="stylesheet" href="style .css">
</head>
<body>

    <div class="container">
        <h1>Student Management System</h1>
        <p>Academic Results Analysis</p>

        <h2>Students Report</h2>

        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Name</th>
                    <th>Average</th>
                    <th>Grade</th>
                    <th>Result</th>
                </tr>
            </thead>
            <tbody id="studentsTable"></tbody>
        </table>

        <h2>Mercy Committee</h2>

        <table>
            <thead>
                <tr>
                    <th>Name</th>
                    <th>Old Average</th>
                    <th>New Average</th>
                </tr>
            </thead>
            <tbody id="mercyTable"></tbody>
        </table>

        <h2 id="mercyAverage"></h2>
    </div>

    <script src="test.js"></script>
</body>
</html>
